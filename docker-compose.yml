  # scraper_spin_gold:
  #   <<: *scraper
  #   container_name: gg_scraper_spin_gold
  #   environment:
  #     <<: *scraper-env
  #     GAME_NAME: 3MAX and 6MAX will share a single leaderboard.
  #     PROMO_URL: "https://ggpoker.com/poker-promotions/spin-gold-daily-leaderboard/"
  #     TABLE_NAME: "SPIN_GOLD"

  api:
    build: .
    image: gg-api:latest
    container_name: gg_api
    command: python serve.py
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Prefer private DB URL if available; fallback to DATABASE_URL or public
      DATABASE_PRIVATE_URL: "${DATABASE_PRIVATE_URL:-}"
      DATABASE_URL: *postgres-url
      DATABASE_PUBLIC_URL: "${DATABASE_PUBLIC_URL:-}"
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:

# Remove the "version: '3.9'" line from docker-compose.yml

x-postgres-url: &postgres-url "postgresql://gguser:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ggpoker"

x-scraper: &scraper
  build: .
  image: gg-scraper:latest

  depends_on:
    postgres:
      condition: service_healthy
  environment: &scraper-env
    MAX_TS_COLUMNS: "8760"
    DATABASE_URL: *postgres-url
    HEADLESS: "0"
    CHROME_BIN: /usr/bin/chromium
    CHROME_TYPE: chromium
  volumes:
    - ./data:/data
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ggpoker
      POSTGRES_USER: gguser
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gguser -d ggpoker"]
      interval: 5s
      timeout: 5s
      retries: 10

  scraper_plo:
    <<: *scraper
    container_name: gg_scraper_plo
    environment:
      <<: *scraper-env
      GAME_NAME: PLO
      PROMO_URL: "https://ggpoker.com/poker-promotions/omaha-daily-leaderboard/"
      TABLE_NAME: ""
      INTERVAL_BEFORE: "1"
      INTERVAL_AFTER: "120"
      SLEEP_TIME_BEFORE_NEXT_BLIND_LEVEL: "12"

  scraper_plo-5:
    <<: *scraper
    container_name: gg_scraper_plo-5
    environment:
      <<: *scraper-env
      GAME_NAME: PLO-5
      PROMO_URL: "https://ggpoker.com/poker-promotions/omaha-daily-leaderboard/"
      TABLE_NAME: ""
      INTERVAL_BEFORE: "31"
      INTERVAL_AFTER: "90"
      SLEEP_TIME_BEFORE_NEXT_BLIND_LEVEL: "12"

  scraper_plo-6:
    <<: *scraper
    container_name: gg_scraper_plo-6
    environment:
      <<: *scraper-env
      GAME_NAME: PLO-6
      PROMO_URL: "https://ggpoker.com/poker-promotions/omaha-daily-leaderboard/"
      TABLE_NAME: ""
      INTERVAL_BEFORE: "21"
      INTERVAL_AFTER: "100"
      SLEEP_TIME_BEFORE_NEXT_BLIND_LEVEL: "12"

  scraper_holdem:
    <<: *scraper
    container_name: gg_scraper_holdem
    environment:
      <<: *scraper-env
      GAME_NAME: Hold'em
      PROMO_URL: "https://ggpoker.com/poker-promotions/holdem-daily-leaderboard/"
      TABLE_NAME: ""
      INTERVAL_BEFORE: "15"
      INTERVAL_AFTER: "115"
      SLEEP_TIME_BEFORE_NEXT_BLIND_LEVEL: "12"
  scraper_holdem-9:
    <<: *scraper
    container_name: gg_scraper_holdem-9
    environment:
      <<: *scraper-env
      GAME_NAME: 9Max (Ante) Games
      PROMO_URL: "https://ggpoker.com/poker-promotions/holdem-daily-leaderboard/"
      TABLE_NAME: ""
      INTERVAL_BEFORE: "35"
      INTERVAL_AFTER: "95"
      SLEEP_TIME_BEFORE_NEXT_BLIND_LEVEL: "12"

  scraper_holdem-rush:
    <<: *scraper
    container_name: gg_scraper_holdem-rush
    environment:
      <<: *scraper-env
      GAME_NAME: Hold’em
      PROMO_URL: "https://ggpoker.com/poker-promotions/rush-cash-daily-leaderboard/"
      TABLE_NAME: "RUSH"
      INTERVAL_BEFORE: "70"
      INTERVAL_AFTER: "60"
      SLEEP_TIME_BEFORE_NEXT_BLIND_LEVEL: "12"

  scraper_plo-rush:
    <<: *scraper
    container_name: gg_scraper_plo-rush
    environment:
      <<: *scraper-env
      GAME_NAME: Omaha
      PROMO_URL: "https://ggpoker.com/poker-promotions/rush-cash-daily-leaderboard/"
      TABLE_NAME: "RUSH"
      INTERVAL_BEFORE: "90"
      INTERVAL_AFTER: "50"
      SLEEP_TIME_BEFORE_NEXT_BLIND_LEVEL: "12"

  # scraper_holdem_aof:

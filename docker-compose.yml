# Remove the "version: '3.9'" line from docker-compose.yml

x-scraper: &scraper
  build: .
  image: gg-scraper:latest

  depends_on:
    postgres:
      condition: service_healthy
  environment: &scraper-env
    INTERVAL: "40"
    MAX_TS_COLUMNS: "8760"
    DATABASE_URL: "postgresql://gguser:ggpassword@postgres:5432/ggpoker"
    HEADLESS: "0"
    CHROME_BIN: /usr/bin/chromium
    CHROME_TYPE: chromium
  volumes:
    - ./data:/data
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ggpoker
      POSTGRES_USER: gguser
      POSTGRES_PASSWORD: ggpassword
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gguser -d ggpoker"]
      interval: 5s
      timeout: 5s
      retries: 10

  scraper_plo:
    <<: *scraper
    container_name: gg_scraper_plo
    environment:
      <<: *scraper-env
      GAME_NAME: PLO
      PROMO_URL: "https://ggpoker.com/poker-promotions/omaha-daily-leaderboard/"

  scraper_plo-5:
    <<: *scraper
    container_name: gg_scraper_plo-5
    environment:
      <<: *scraper-env
      GAME_NAME: PLO-5
      PROMO_URL: "https://ggpoker.com/poker-promotions/omaha-daily-leaderboard/"

  scraper_plo-6:
    <<: *scraper
    container_name: gg_scraper_plo-6
    environment:
      <<: *scraper-env
      GAME_NAME: PLO-6
      PROMO_URL: "https://ggpoker.com/poker-promotions/omaha-daily-leaderboard/"

  scraper_holdem:
    <<: *scraper
    container_name: gg_scraper_holdem
    environment:
      <<: *scraper-env
      GAME_NAME: Hold'em
      PROMO_URL: "https://ggpoker.com/poker-promotions/holdem-daily-leaderboard/"

  scraper_holdem-9:
    <<: *scraper
    container_name: gg_scraper_holdem-9
    environment:
      <<: *scraper-env
      GAME_NAME: 9Max (Ante) Games
      PROMO_URL: "https://ggpoker.com/poker-promotions/holdem-daily-leaderboard/"

  scraper_holdem-rush:
    <<: *scraper
    container_name: gg_scraper_holdem-rush
    environment:
      <<: *scraper-env
      GAME_NAME: Hold’em
      PROMO_URL: "https://ggpoker.com/poker-promotions/rush-cash-daily-leaderboard/"

  scraper_plo-rush:
    <<: *scraper
    container_name: gg_scraper_plo-rush
    environment:
      <<: *scraper-env
      GAME_NAME: Omaha
      PROMO_URL: "https://ggpoker.com/poker-promotions/rush-cash-daily-leaderboard/"

  # scraper_holdem_aof:
  #   <<: *scraper
  #   container_name: gg_scraper_holdem_aof
  #   environment:
  #     <<: *scraper-env
  #     GAME_NAME: Hold'em
  #     PROMO_URL: "https://ggpoker.com/poker-promotions/aof-daily-leaderboard/"

  # scraper_plo_aof:
  #   <<: *scraper
  #   container_name: gg_scraper_plo_aof
  #   environment:
  #     <<: *scraper-env
  #     GAME_NAME: Omaha
  #     PROMO_URL: "https://ggpoker.com/poker-promotions/aof-daily-leaderboard/"

  # scraper_spin_gold:
  #   <<: *scraper
  #   container_name: gg_scraper_spin_gold
  #   environment:
  #     <<: *scraper-env
  #     GAME_NAME: 3MAX and 6MAX will share a single leaderboard.
  #     PROMO_URL: "https://ggpoker.com/poker-promotions/spin-gold-daily-leaderboard/"

  api:
    build: .
    image: gg-api:latest
    container_name: gg_api
    command: python api.py
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Prefer private DB URL if available; fallback to DATABASE_URL or public
      - DATABASE_PRIVATE_URL=${DATABASE_PRIVATE_URL:-}
      - DATABASE_URL=postgresql://gguser:ggpassword@postgres:5432/ggpoker
      - DATABASE_PUBLIC_URL=${DATABASE_PUBLIC_URL:-}
      - PORT=8000
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
